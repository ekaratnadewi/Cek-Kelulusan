<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cek Kelulusan</title>
  <style>
    body { font-family: Arial; text-align: center; padding: 50px; }
    input { padding: 10px; width: 250px; }
    button { padding: 10px 20px; cursor: pointer; }
    #hasil { margin-top: 20px; font-size: 20px; font-weight: bold; }
  </style>
</head>
<body>

  <h1>CEK KELULUSAN</h1>
  <p>Masukkan NISN:</p>

  <input type="text" id="nisn" placeholder="Contoh: 1234567890">
  <button onclick="cekKelulusan()">CEK</button>

  <div id="hasil"></div>

  <!-- SheetJS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <script>
    let dataSiswa = [];

    async function loadExcel() {
      const response = await fetch("Data.xlsx");
      const arrayBuffer = await response.arrayBuffer();
      const workbook = XLSX.read(arrayBuffer, { type: "array" });

      const sheetName = workbook.SheetNames[0];
      const sheet = workbook.Sheets[sheetName];

      dataSiswa = XLSX.utils.sheet_to_json(sheet);
      console.log("Data Excel Loaded:", dataSiswa);
    }

    async function cekKelulusan() {
      const nisn = document.getElementById("nisn").value.trim();
      const hasil = document.getElementById("hasil");

      if (dataSiswa.length === 0) {
        await loadExcel();
      }

      if (!nisn) {
        hasil.innerHTML = "⚠️ Masukkan NISN dulu.";
        return;
      }

      const siswa = dataSiswa.find(s => String(s.nisn).trim() === nisn);

      if (siswa) {
        if (String(siswa.status).toUpperCase() === "LULUS") {
          hasil.innerHTML = `🎉 Selamat ${siswa.nama}, Anda <span style="color:green;">LULUS</span>`;
        } else {
          hasil.innerHTML = `😢 Maaf ${siswa.nama}, Anda <span style="color:red;">TIDAK LULUS</span>`;
        }
      } else {
        hasil.innerHTML = "❌ NISN tidak ditemukan.";
      }
    }

    // load excel saat halaman dibuka
    loadExcel();
  </script>

</body>
</html>
